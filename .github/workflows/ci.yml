name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oprypin/install-crystal@v1
        with:
          crystal: latest
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install mruby build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison gperf
      - name: Install mruby build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison gperf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Build libmruby
        run: make
      - name: Format check
        run: crystal tool format --check
      - name: Specs
        run: crystal spec
      - name: C smoke test
        run: |
          mkdir -p build
          gcc -I vendor/mruby/include -I vendor/mruby/build/host/include \
            -o build/smoke scripts/c_smoke.c lib/mrb_shim.o lib/libmruby.a -lm
          ./build/smoke
      - name: Examples
        run: make examples

  # Windows, official Crystal (MSVC target — the official Windows distribution
  # links with cl.exe): build mruby with the visualcpp toolchain and the shim
  # with cl.exe, then run the full spec suite, examples, and a C-level smoke
  # test through the MSVC linker. This is the end-to-end MSVC verification.
  windows-spec:
    name: spec (windows, msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: oprypin/install-crystal@v1
        with:
          crystal: latest
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build libmruby and shim (MSVC)
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Assert staged artifacts
        shell: pwsh
        run: |
          $files = @('lib/libmruby.lib', 'lib/libmruby.a', 'lib/mrb_shim.obj', 'lib/mrb_shim.o')
          foreach ($f in $files) {
            if (!(Test-Path $f)) { throw "missing artifact: $f" }
            "{0}: {1} bytes" -f $f, (Get-Item $f).Length
          }
      - name: Format check
        shell: pwsh
        run: crystal tool format --check
      - name: Specs
        shell: pwsh
        run: crystal spec
      - name: C smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cl /nologo /MD /D_CRT_SECURE_NO_WARNINGS /I vendor/mruby/include `
            /I vendor/mruby/build/host/include /Fe:build\smoke.exe `
            scripts/c_smoke.c lib/mrb_shim.obj lib/libmruby.lib
          .\build\smoke.exe
      - name: Examples
        shell: pwsh
        run: |
          crystal run examples/calculator.cr
          crystal run examples/host_callback.cr
          crystal run examples/json_values.cr

  # Windows, MSYS2 UCRT64 gcc: verify the Makefile path (mruby gcc build, gcc
  # shim, C smoke). No Crystal steps: the official Crystal Windows
  # distribution targets MSVC even at 1.21.1, so mingw-target Crystal specs
  # are only reachable with an MSYS2-built compiler (verified locally; see
  # docs/COMPATIBILITY.md).
  windows-gcc:
    name: windows (msys2 ucrt64 gcc, make + C smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: base-devel git mingw-w64-ucrt-x86_64-gcc
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Build libmruby and shim (gcc)
        shell: msys2 {0}
        run: make CC=gcc
      - name: C smoke test
        shell: msys2 {0}
        run: |
          mkdir -p build
          gcc -I vendor/mruby/include -I vendor/mruby/build/host/include \
            -o build/smoke scripts/c_smoke.c lib/mrb_shim.o lib/libmruby.a -lm
          ./build/smoke
